[project]
name = "authfly"
version = "0.1.0"
description = "Authfly adapter: JSON API client and OpenID Connect relying party (Stalwart)"
license = "MIT"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["authfly"]
